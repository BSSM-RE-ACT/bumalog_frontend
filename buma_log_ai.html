<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUMA-LOG_ai</title>
  <style>
    /* 기본 설정 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #ffffff; color: #000000; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }

    /* 1. 네비게이션 바 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;  
      padding: 15px 10%;
      border-bottom: 1px solid #eee;
      background: #ffffff;
    }
    .logo { font-size: 24px; font-weight: bold; color: #8eb3a2; }
    .nav-menu { display: flex; align-items: center; gap: 20px; }
    .nav-menu a { font-size: 14px; font-weight: 500; }
    .btn-login {
      background-color: #333;
      color: white !important;
      padding: 6px 15px;
      border-radius: 8px;
    }

    /* 2. 메인 히어로 섹션 */
    .hero {
      text-align: center;
      padding: 80px 0;
    }
    .hero h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #1a2a3a;
    }

    /* 3. 리스트 섹션 */
    .content-section {
      background-color: #f5f6ff; /* 연보라빛 배경 */
      padding: 60px 10%;
      min-height: 600px;
    }
    .section-title { margin-bottom: 30px; }
    .section-title h2 { font-size: 20px; margin-bottom: 5px; }
    .section-title p { font-size: 14px; color: #888; text-transform: uppercase; }

    /* 4. 카드 스타일 */
    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      position: relative;
    }
    .card-img {
      width: 100px;
      height: 100px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin-right: 25px;
    }
    .card-info { flex: 1; }
    .card-info h3 { font-size: 20px; margin-bottom: 8px; }
    .card-info p { font-size: 14px; color: #666; margin-bottom: 15px; }
    .tags span {
      font-size: 12px;
      padding: 4px 10px;
      background: #f0f2ff;
      color: #5c6bc0;
      border-radius: 5px;
      margin-right: 8px;
      font-weight: 600;
    }

    /* 오른쪽 체크 및 버튼 */
    .card-right { text-align: right; }
    .check-box {
      width: 50px;
      height: 50px;
      border: 2px solid #333;
      border-radius: 12px;
      margin-bottom: 10px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }
    .btn-reply {
      display: block;
      font-size: 12px;
      background: #eee;
      padding: 5px 10px;
      border-radius: 5px;
    }

    /* 5. 푸터 */
    .footer {
      padding: 40px 10%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid #eee;
    }
    .footer-info p { font-size: 12px; color: #888; margin-top: 5px; }
    .footer-social a { margin-left: 15px; font-size: 20px; color: #5c6bc0; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">R:</div>
    <ul class="nav-menu">
      <li><a href="#">부마로그</a></li>
      <li><a href="#">질문하기</a></li>
      <li><a href="#">커뮤니티</a></li>
      <li><a href="http://127.0.0.1:5500/test.html" class="btn-login">로그인</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>BUMA - LOG</h1>
  </header>

  <section class="content-section">
    <div class="section-title">
      <h2>최신 부마로그</h2>
      <p>RECENTLY BUMA-LOG</p>
    </div>

    <div class="card">
      <div class="card-img">?</div>
      <div class="card-info">
        <h3>Title</h3>
        <p>마크다운 형식의 글</p>
        <div class="tags">
          <span>BACKEND ✕</span>
        </div>
      </div>
      <div class="card-right">
        <div class="check-box">✓</div>
        <a href="#" class="btn-reply">답변하기</a>
      </div>
    </div>

    <div class="card">
      <div class="card-img">🖼️</div>
      <div class="card-info">
        <h3>Title</h3>
        <p>마크다운 형식의 글</p>
        <div class="tags">
          <span>FRONTEND ✕</span>
          <span>ERROR-LOG ✕</span>
        </div>
      </div>
      <div class="card-right">
        <div class="check-box"></div>
        <a href="#" class="btn-reply">답변하기</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-info">
      <strong>BUMA-LOG</strong>
      <p>제작: RE:ACT 동아리 | 관리: RE:ACT 동아리 | 문의:</p>
      <p>UX design / Wireframing</p>
    </div>
    <div class="footer-social">
      <a href="#">𝕏</a>
      <a href="#">📷</a>
      <a href="#">📺</a>
    </div>
  </footer>

</body>
</html>
