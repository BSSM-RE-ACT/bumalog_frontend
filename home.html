<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUMA-LOG</title>
    <style>
    /* 기본 설정 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #ffffff; color: #000000; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }

    /* 1. 네비게이션 바 */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 10%;
      border-bottom: 1px solid #eee;
      background: #fff;
    }
    .logo { font-size: 24px; font-weight: bold; color: #8eb3a2; }
    .nav-menu { display: flex; align-items: center; gap: 20px; }
    .nav-menu a { font-size: 14px; font-weight: 500; }
    .btn-login {
      background-color: #333;
      color: white !important;
      padding: 6px 15px;
      border-radius: 8px;
    }

    /* 2. 메인 히어로 섹션 */
    .hero {
      padding: 100px 10%;
      text-align: center;
    }
    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .hero p {
      font-size: 18px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
</body>
</html>
